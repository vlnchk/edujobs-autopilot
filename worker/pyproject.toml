[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edujobs-content-worker"
version = "0.1.0"
description = "Stateless content acquisition worker for EduJobs Workflow A"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.109,<1",
  "httpx>=0.25,<1",
  "pydantic>=2.5,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4,<9",
  "pytest-asyncio>=0.21,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
